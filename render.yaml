services:
  - type: web
    name: chatmimic-ai
    env: python
    region: singapore
    plan: free
    branch: deployment
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
